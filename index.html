<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<title>Mobile Markets Dashboard</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        background: #0F0F0F;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    body {
        display: flex;
        flex-direction: column;
    }

    .chart-panel {
        position: relative;
        width: 100%;
        height: 50vh;
        border-bottom: 2px solid #1A1A1A;
        background: #0F0F0F;
        overflow: hidden;
    }

    .chart-panel:last-child {
        border-bottom: none;
    }

    .chart-title {
        position: absolute;
        top: 8px;
        left: 12px;
        z-index: 20;
        color: #FFFFFF;
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 0.5px;
        background: rgba(0,0,0,0.45);
        padding: 4px 8px;
        border-radius: 6px;
        pointer-events: none;
        backdrop-filter: blur(4px);
    }

    .tv-wrap {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
    }

    .tradingview-widget-container {
        width: 100%;
        height: 100%;
    }

    .tradingview-widget-container__widget {
        width: 100%;
        height: 100%;
    }

    iframe {
        width: 100% !important;
        height: 100% !important;
    }

    /* Better touch feel on Android */
    body,
    iframe {
        touch-action: manipulation;
    }
</style>
</head>

<body>

<!-- BTC -->
<div class="chart-panel">

    <div class="chart-title">
        BTC/USD
    </div>

    <div class="tv-wrap">

        <div class="tradingview-widget-container">
            <div class="tradingview-widget-container__widget"></div>

            <script
                type="text/javascript"
                src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js"
                async>
            {
              "autosize": true,

              "symbol": "KRAKEN:BTCUSD",
              "interval": "240",

              "timezone": "America/Phoenix",
              "theme": "dark",
              "style": "1",
              "locale": "en",

              "allow_symbol_change": false,

              "hide_top_toolbar": false,
              "hide_side_toolbar": true,
              "hide_legend": true,
              "hide_volume": true,

              "withdateranges": false,
              "details": false,
              "calendar": false,

              "backgroundColor": "#0F0F0F",
              "gridColor": "rgba(242,242,242,0.06)",

              "studies": [
                "STD;Bollinger_Bands",
                "STD;Stochastic_RSI"
              ]
            }
            </script>
        </div>

    </div>

</div>

<!-- SPX -->
<div class="chart-panel">

    <div class="chart-title">
        S&P 500
    </div>

    <div class="tv-wrap">

        <div class="tradingview-widget-container">
            <div class="tradingview-widget-container__widget"></div>

            <script
                type="text/javascript"
                src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js"
                async>
            {
              "autosize": true,

              "symbol": "FOREXCOM:SPXUSD",
              "interval": "240",

              "timezone": "America/Phoenix",
              "theme": "dark",
              "style": "1",
              "locale": "en",

              "allow_symbol_change": false,

              "hide_top_toolbar": false,
              "hide_side_toolbar": true,
              "hide_legend": true,
              "hide_volume": true,

              "withdateranges": false,
              "details": false,
              "calendar": false,

              "backgroundColor": "#0F0F0F",
              "gridColor": "rgba(242,242,242,0.06)",

              "studies": [
                "STD;Bollinger_Bands",
                "STD;Stochastic_RSI"
              ]
            }
            </script>
        </div>

    </div>

</div>

</body>
</html>
